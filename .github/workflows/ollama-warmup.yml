name: Ollama Warmup

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Ollama model warm
        run: |
          curl -s -X POST http://187.124.0.184:32846/api/generate \
            -H "Content-Type: application/json" \
            -d '{"model":"llama3.1","prompt":"Hallo","stream":false}' \
            > /dev/null 2>&1 || echo "Warmup attempted"
          echo "$(date): Warmup completed"
